<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="360" height="740" style="background:#f5f5f5;">
  <!-- Device Frame -->
  <rect x="10" y="10" width="340" height="720" rx="36" fill="#ffffff" stroke="#666666" stroke-width="3"/>
  <rect x="150" y="22" width="60" height="8" rx="4" fill="#cccccc"/>

  <!-- Top App Bar -->
  <text x="180" y="70" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222" text-anchor="middle">Dashboard Guru Mapel</text>
  <!-- Logout icon -->
  <path d="M 315 62 L 325 62 M 321 58 L 325 62 L 321 66" fill="none" stroke="#666666" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 318 57 H 312 V 67 H 318" fill="none" stroke="#666666" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Title Greeting -->
  <text x="30" y="115" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">Buka Sesi Presensi &amp;</text>
  <text x="30" y="135" font-family="sans-serif" font-size="17" font-weight="bold" fill="#222222">Kelola Pembelajaran</text>

  <!-- Section: Overview Pengajaran -->
  <text x="30" y="178" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Overview Pengajaran</text>
  
  <!-- Stats Card Box (2x2 Grid) -->
  <rect x="30" y="192" width="300" height="135" rx="16" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  
  <!-- Row 1 Stat 1: 4 Sesi Mapel -->
  <circle cx="56" cy="225" r="12" fill="#f0f0f0" stroke="#888888" stroke-width="1"/>
  <circle cx="56" cy="225" r="3" fill="#666666"/>
  <text x="80" y="222" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">4</text>
  <text x="80" y="235" font-family="sans-serif" font-size="10" fill="#666666">Sesi Mapel</text>

  <!-- Row 1 Stat 2: 3 Sesi Aktif -->
  <circle cx="206" cy="225" r="12" fill="#f0f0f0" stroke="#888888" stroke-width="1"/>
  <circle cx="206" cy="225" r="3" fill="#666666"/>
  <text x="230" y="222" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">3</text>
  <text x="230" y="235" font-family="sans-serif" font-size="10" fill="#666666">Sesi Aktif</text>

  <!-- Horizontal Divider inside Card -->
  <line x1="45" y1="252" x2="315" y2="252" stroke="#eeeeee" stroke-width="1"/>

  <!-- Row 2 Stat 1: 3 Kelas -->
  <circle cx="56" cy="282" r="12" fill="#f0f0f0" stroke="#888888" stroke-width="1"/>
  <circle cx="56" cy="282" r="3" fill="#666666"/>
  <text x="80" y="278" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">3 Kelas</text>
  <text x="80" y="291" font-family="sans-serif" font-size="10" fill="#666666">Kelas Diajar</text>

  <!-- Row 2 Stat 2: 2 Mapel -->
  <circle cx="206" cy="282" r="12" fill="#f0f0f0" stroke="#888888" stroke-width="1"/>
  <circle cx="206" cy="282" r="3" fill="#666666"/>
  <text x="230" y="278" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">2 Mapel</text>
  <text x="230" y="291" font-family="sans-serif" font-size="10" fill="#666666">Mapel Diampu</text>

  <!-- Primary Button: Buka Presensi Harian -->
  <rect x="30" y="345" width="300" height="48" rx="14" fill="#888888" stroke="#666666" stroke-width="2"/>
  <!-- QR Icon -->
  <rect x="110" y="361" width="16" height="16" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="114" y="365" width="8" height="8" fill="#ffffff"/>
  <text x="136" y="375" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Buka Presensi Harian</text>

  <!-- Secondary Button: Riwayat Presensi Guru -->
  <rect x="30" y="405" width="300" height="48" rx="14" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  <circle cx="118" cy="429" r="7" fill="none" stroke="#666666" stroke-width="1.2"/>
  <path d="M 118 425 L 118 429 L 121 431" fill="none" stroke="#666666" stroke-width="1.2"/>
  <text x="132" y="434" font-family="sans-serif" font-size="13" font-weight="bold" fill="#666666">Riwayat Presensi Guru</text>

  <!-- Section: Riwayat Presensi Hari Ini -->
  <text x="30" y="485" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Riwayat Presensi Hari Ini</text>
  <text x="310" y="485" font-family="sans-serif" font-size="12" fill="#888888" text-anchor="end">Lihat Semua</text>

  <!-- Empty state message -->
  <text x="180" y="540" font-family="sans-serif" font-size="12" fill="#aaaaaa" text-anchor="middle">Belum ada sesi presensi dicatat hari ini.</text>
</svg>
