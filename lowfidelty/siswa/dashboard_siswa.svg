<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="360" height="740" style="background:#f5f5f5;">
  <!-- Device Frame -->
  <rect x="10" y="10" width="340" height="720" rx="36" fill="#ffffff" stroke="#666666" stroke-width="3"/>
  <rect x="150" y="22" width="60" height="8" rx="4" fill="#cccccc"/>

  <!-- Top App Bar -->
  <text x="180" y="70" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">Dasbor Siswa</text>
  <!-- Logout icon -->
  <path d="M 315 62 L 325 62 M 321 58 L 325 62 L 321 66" fill="none" stroke="#666666" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 318 57 H 312 V 67 H 318" fill="none" stroke="#666666" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Greeting Title -->
  <text x="30" y="112" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Selamat Datang,</text>
  <text x="30" y="132" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Ahmad Fauzi (Siswa IX-A)!</text>
  <text x="30" y="150" font-family="sans-serif" font-size="12" font-weight="bold" fill="#666666">Kelas IX-A</text>

  <!-- Banner Card: QR Code Presensi Saya -->
  <rect x="30" y="170" width="300" height="90" rx="20" fill="#888888" stroke="#666666" stroke-width="2"/>
  <!-- QR Icon Box -->
  <rect x="48" y="185" width="60" height="60" rx="12" fill="#ffffff"/>
  <rect x="60" y="197" width="36" height="36" rx="4" fill="none" stroke="#666666" stroke-width="2"/>
  <rect x="68" y="205" width="20" height="20" fill="#666666"/>
  <!-- Banner Text -->
  <text x="122" y="202" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">QR Code Presensi Saya</text>
  <text x="122" y="220" font-family="sans-serif" font-size="10" fill="#f0f0f0">Ketuk untuk menampilkan,</text>
  <text x="122" y="233" font-family="sans-serif" font-size="10" fill="#f0f0f0">mengunduh, atau membagikan Kartu QR</text>
  <path d="M 305 210 L 310 215 L 305 220" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- Section: Ringkasan Kehadiran Anda -->
  <text x="30" y="285" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Ringkasan Kehadiran Anda</text>

  <!-- Stats Grid Box (2x2) -->
  <rect x="30" y="300" width="300" height="115" rx="16" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  
  <!-- Row 1 Stat 1: 88% Kehadiran -->
  <circle cx="56" cy="326" r="10" fill="#f0f0f0" stroke="#888888" stroke-width="1"/>
  <text x="76" y="325" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">88%</text>
  <text x="76" y="338" font-family="sans-serif" font-size="10" fill="#666666">Kehadiran</text>

  <!-- Row 1 Stat 2: 0 Hari Sakit -->
  <circle cx="206" cy="326" r="10" fill="#f0f0f0" stroke="#888888" stroke-width="1"/>
  <text x="226" y="325" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">0 Hari</text>
  <text x="226" y="338" font-family="sans-serif" font-size="10" fill="#666666">Sakit</text>

  <!-- Horizontal Divider inside Card -->
  <line x1="45" y1="355" x2="315" y2="355" stroke="#eeeeee" stroke-width="1"/>

  <!-- Row 2 Stat 1: 0 Hari Izin -->
  <circle cx="56" cy="380" r="10" fill="#f0f0f0" stroke="#888888" stroke-width="1"/>
  <text x="76" y="379" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">0 Hari</text>
  <text x="76" y="392" font-family="sans-serif" font-size="10" fill="#666666">Izin</text>

  <!-- Row 2 Stat 2: 1 Hari Alpa -->
  <circle cx="206" cy="380" r="10" fill="#f0f0f0" stroke="#888888" stroke-width="1"/>
  <text x="226" y="379" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">1 Hari</text>
  <text x="226" y="392" font-family="sans-serif" font-size="10" fill="#666666">Alpa / Tanpa Ket.</text>

  <!-- Buttons Row -->
  <rect x="30" y="435" width="142" height="44" rx="14" fill="#888888" stroke="#666666" stroke-width="2"/>
  <circle cx="52" cy="457" r="6" fill="none" stroke="#ffffff" stroke-width="1.2"/>
  <path d="M 52 453 L 52 457 L 55 459" fill="none" stroke="#ffffff" stroke-width="1.2"/>
  <text x="65" y="462" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Riwayat Hadir</text>

  <rect x="188" y="435" width="142" height="44" rx="14" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  <rect x="208" y="450" width="12" height="12" rx="1" fill="none" stroke="#666666" stroke-width="1.2"/>
  <text x="226" y="462" font-family="sans-serif" font-size="12" font-weight="bold" fill="#666666">Ajukan Izin</text>

  <!-- Section: Riwayat Kehadiran Terbaru -->
  <text x="30" y="512" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Riwayat Kehadiran Terbaru</text>
  <text x="310" y="512" font-family="sans-serif" font-size="12" fill="#888888" text-anchor="end">Lihat Semua</text>

  <!-- History Item 1 -->
  <rect x="30" y="525" width="300" height="56" rx="14" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  <rect x="46" y="538" width="32" height="30" rx="8" fill="#f0f0f0"/>
  <rect x="54" y="546" width="16" height="14" fill="none" stroke="#666666" stroke-width="1.2"/>
  <text x="90" y="548" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">Sesi Harian Kelas</text>
  <text x="90" y="565" font-family="sans-serif" font-size="10" fill="#888888">Waktu: 14/8/2026 pukul 08:45</text>
  <text x="310" y="558" font-family="sans-serif" font-size="11" font-weight="bold" fill="#222222" text-anchor="end">✓ Hadir</text>

  <!-- History Item 2 -->
  <rect x="30" y="590" width="300" height="56" rx="14" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  <rect x="46" y="603" width="32" height="30" rx="8" fill="#f0f0f0"/>
  <rect x="54" y="611" width="16" height="14" fill="none" stroke="#666666" stroke-width="1.2"/>
  <text x="90" y="613" font-family="sans-serif" font-size="13" font-weight="bold" fill="#222222">Sesi Harian Kelas</text>
  <text x="90" y="630" font-family="sans-serif" font-size="10" fill="#888888">Waktu: 19/8/2026 pukul 18:15</text>
  <text x="310" y="623" font-family="sans-serif" font-size="11" font-weight="bold" fill="#222222" text-anchor="end">✓ Hadir</text>
</svg>
