<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="360" height="740" style="background:#f5f5f5;">
  <!-- Device Frame -->
  <rect x="10" y="10" width="340" height="720" rx="36" fill="#ffffff" stroke="#666666" stroke-width="3"/>
  <rect x="150" y="22" width="60" height="8" rx="4" fill="#cccccc"/>

  <!-- Top App Bar -->
  <path d="M 35 60 L 25 70 L 35 80" fill="none" stroke="#222222" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="75" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222" text-anchor="middle">Sesi Kelas IX-A</text>

  <!-- Session Summary Card -->
  <rect x="30" y="105" width="300" height="135" rx="16" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  <text x="48" y="132" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Kelas IX-A</text>
  <text x="48" y="152" font-family="sans-serif" font-size="12" fill="#666666">Sesi Presensi Harian Pagi</text>

  <!-- Active Session Badge -->
  <rect x="235" y="118" width="80" height="24" rx="12" fill="#e5e5e5"/>
  <text x="275" y="134" font-family="sans-serif" font-size="11" font-weight="bold" fill="#555555" text-anchor="middle">Sesi Aktif</text>

  <line x1="45" y1="170" x2="315" y2="170" stroke="#eeeeee" stroke-width="1"/>

  <!-- Attendance Stats Row -->
  <!-- Total -->
  <text x="70" y="195" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">3</text>
  <text x="70" y="210" font-family="sans-serif" font-size="10" fill="#666666" text-anchor="middle">Total</text>
  <!-- Hadir -->
  <text x="125" y="195" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">1</text>
  <text x="125" y="210" font-family="sans-serif" font-size="10" fill="#666666" text-anchor="middle">Hadir</text>
  <!-- Izin -->
  <text x="180" y="195" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">0</text>
  <text x="180" y="210" font-family="sans-serif" font-size="10" fill="#666666" text-anchor="middle">Izin</text>
  <!-- Sakit -->
  <text x="235" y="195" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">0</text>
  <text x="235" y="210" font-family="sans-serif" font-size="10" fill="#666666" text-anchor="middle">Sakit</text>
  <!-- Alpa -->
  <text x="290" y="195" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222" text-anchor="middle">2</text>
  <text x="290" y="210" font-family="sans-serif" font-size="10" fill="#666666" text-anchor="middle">Alpa</text>

  <!-- Scan QR Button -->
  <rect x="30" y="255" width="300" height="48" rx="14" fill="#888888" stroke="#666666" stroke-width="2"/>
  <rect x="95" y="271" width="16" height="16" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="99" y="275" width="8" height="8" fill="#ffffff"/>
  <text x="122" y="285" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Scan QR Code Siswa</text>

  <!-- Section Title -->
  <text x="30" y="335" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Daftar Presensi Siswa</text>

  <!-- Item 1: Lestari Putri -->
  <rect x="30" y="350" width="300" height="55" rx="14" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  <circle cx="56" cy="377" r="16" fill="#e5e5e5"/>
  <text x="56" y="382" font-family="sans-serif" font-size="14" font-weight="bold" fill="#555555" text-anchor="middle">L</text>
  <text x="84" y="372" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">Lestari Putri (Siswa IX-A)</text>
  <text x="84" y="387" font-family="sans-serif" font-size="10" fill="#888888">Belum di-scan</text>
  <rect x="250" y="365" width="65" height="24" rx="12" fill="#f0f0f0"/>
  <text x="282" y="381" font-family="sans-serif" font-size="10" font-weight="bold" fill="#666666" text-anchor="middle">Alpa</text>

  <!-- Item 2: cek -->
  <rect x="30" y="415" width="300" height="55" rx="14" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  <circle cx="56" cy="442" r="16" fill="#e5e5e5"/>
  <text x="56" y="447" font-family="sans-serif" font-size="14" font-weight="bold" fill="#555555" text-anchor="middle">c</text>
  <text x="84" y="437" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">cek</text>
  <text x="84" y="452" font-family="sans-serif" font-size="10" fill="#888888">Belum di-scan</text>
  <rect x="250" y="430" width="65" height="24" rx="12" fill="#f0f0f0"/>
  <text x="282" y="446" font-family="sans-serif" font-size="10" font-weight="bold" fill="#666666" text-anchor="middle">Alpa</text>

  <!-- Item 3: Ahmad Fauzi -->
  <rect x="30" y="480" width="300" height="55" rx="14" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  <circle cx="56" cy="507" r="16" fill="#e5e5e5"/>
  <text x="56" y="512" font-family="sans-serif" font-size="14" font-weight="bold" fill="#555555" text-anchor="middle">A</text>
  <text x="84" y="500" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222222">Ahmad Fauzi (Siswa IX-A)</text>
  <text x="84" y="515" font-family="sans-serif" font-size="9" fill="#888888">Catatan: Presensi via Scan QR Siswa</text>
  <rect x="250" y="495" width="65" height="24" rx="12" fill="#e0e0e0"/>
  <text x="282" y="511" font-family="sans-serif" font-size="10" font-weight="bold" fill="#222222" text-anchor="middle">✓ Hadir</text>

  <!-- Bottom Lock Button -->
  <rect x="30" y="650" width="300" height="46" rx="14" fill="#ffffff" stroke="#888888" stroke-width="1.5"/>
  <rect x="75" y="665" width="10" height="12" rx="1" fill="none" stroke="#666666" stroke-width="1.2"/>
  <path d="M 77 665 V 661 C 77 659 83 659 83 661 V 665" fill="none" stroke="#666666" stroke-width="1.2"/>
  <text x="94" y="678" font-family="sans-serif" font-size="12" font-weight="bold" fill="#666666">Selesaikan &amp; Tutup Sesi Presensi</text>
</svg>
