<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Low Fidelity Wireframe - Halaman Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace, system-ui, sans-serif;
    }
    body {
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .device-frame {
      width: 360px;
      height: 740px;
      background: #ffffff;
      border: 3px solid #666666;
      border-radius: 36px;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      position: relative;
    }
    .camera-notch {
      position: absolute;
      top: 12px;
      width: 60px;
      height: 8px;
      background: #cccccc;
      border-radius: 4px;
    }
    .header-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 30px;
      text-align: center;
    }
    .qr-icon-placeholder {
      width: 90px;
      height: 90px;
      border: 2px dashed #666666;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-bottom: 16px;
      background: #fafafa;
    }
    .qr-icon-placeholder::before, .qr-icon-placeholder::after {
      content: '';
      position: absolute;
      background: #999999;
    }
    .qr-icon-placeholder::before {
      width: 40px;
      height: 40px;
      border: 2px solid #666666;
    }
    .title {
      font-size: 20px;
      font-weight: bold;
      color: #222222;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 12px;
      color: #666666;
    }
    .card-container {
      width: 100%;
      border: 2px solid #aaaaaa;
      border-radius: 20px;
      padding: 20px;
      background: #ffffff;
    }
    .input-group {
      margin-bottom: 16px;
      position: relative;
    }
    .input-box {
      width: 100%;
      height: 48px;
      border: 1.5px solid #888888;
      border-radius: 12px;
      padding: 0 16px 0 42px;
      font-size: 14px;
      color: #333333;
      background: #f9f9f9;
      outline: none;
    }
    .input-box.with-suffix {
      padding-right: 42px;
    }
    .icon-prefix {
      position: absolute;
      left: 14px;
      top: 14px;
      width: 20px;
      height: 20px;
      border: 1.5px solid #666666;
      border-radius: 3px;
    }
    .icon-suffix {
      position: absolute;
      right: 14px;
      top: 14px;
      width: 20px;
      height: 20px;
      border: 1.5px dashed #666666;
      border-radius: 50%;
    }
    .btn-login {
      width: 100%;
      height: 48px;
      background: #888888;
      border: 2px solid #666666;
      border-radius: 14px;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 24px;
    }
  </style>
</head>
<body>
  <div class="device-frame">
    <div class="camera-notch"></div>
    <div class="header-section">
      <div class="qr-icon-placeholder"></div>
      <div class="title">Sistem Presensi QR</div>
      <div class="subtitle">SMP Muhammadiyah 1 Sekampung Udik</div>
    </div>
    <div class="card-container">
      <div class="input-group">
        <div class="icon-prefix"></div>
        <input type="text" class="input-box" placeholder="Email" readonly>
      </div>
      <div class="input-group">
        <div class="icon-prefix"></div>
        <input type="password" class="input-box with-suffix" placeholder="Password" readonly>
        <div class="icon-suffix"></div>
      </div>
      <button class="btn-login">Login</button>
    </div>
  </div>
</body>
</html>
